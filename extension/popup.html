<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e3e6ea; --text:#24292f; --muted:#6a737d;
          --primary:#2f6feb; --ok:#1a9c6b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 10px 14px; border-bottom: 1px solid var(--border); }
  header b { font-size: 15px; }
  .gear { cursor: pointer; color: var(--muted); font-size: 16px; user-select: none; }
  .cfg { background: var(--card); padding: 10px 14px; border-bottom: 1px solid var(--border);
         display: none; }
  .cfg.show { display: block; }
  .cfg .row { display: flex; gap: 6px; margin-bottom: 6px; }
  input, select, textarea { width: 100%; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { resize: vertical; min-height: 56px; }
  main { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px dashed var(--border); background: transparent; color: var(--muted);
          border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
  .chip.on { border-style: solid; color: var(--primary); border-color: var(--primary); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .foot { display: flex; gap: 8px; align-items: center; }
  button.primary { flex: 1; background: var(--primary); color: #fff; border: none;
                   border-radius: 8px; padding: 8px; font-size: 14px; cursor: pointer; }
  button.primary:disabled { opacity: .5; }
  .hint { color: var(--muted); font-size: 12px; }
  .toast { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgba(0,0,0,.45); color: #fff; font-size: 15px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <b>⏰ 快速提醒</b>
  <span class="gear" id="gear" title="服务器设置">⚙️</span>
</header>

<div class="cfg" id="cfg">
  <div class="row"><input id="serverUrl" placeholder="服务器地址，如 http://<NAS_IP>:15809"></div>
  <div class="row">
    <input id="apiToken" placeholder="API Token（设置页生成）">
    <button class="chip" id="saveCfg" style="border-style:solid">保存</button>
  </div>
  <div class="hint" id="cfgMsg"></div>
</div>

<main>
  <textarea id="title" placeholder="提醒内容，如：dpdns.org 域名续费（Ctrl+Enter 提交）"></textarea>
  <div class="chips" id="dateChips">
    <span class="chip" data-days="0">今天</span>
    <span class="chip" data-days="1">明天</span>
    <span class="chip" data-days="3">3天后</span>
    <span class="chip" data-days="7">7天后</span>
    <span class="chip" data-days="30">30天后</span>
  </div>
  <div class="grid2">
    <label>到期日<input type="date" id="expireDate"></label>
    <label>分类
      <select id="category">
        <option>域名</option><option>服务器</option><option>证件</option>
        <option>订阅</option><option>质保</option><option selected>其他</option>
      </select>
    </label>
  </div>
  <div class="grid2">
    <label>推送时刻（逗号分隔多个）
      <input id="remindTimes" value="09:00" placeholder="09:00,20:00">
    </label>
    <label>备注<input id="note" placeholder="续费入口/账号等（可选）"></label>
  </div>
  <div class="foot">
    <button class="primary" id="submit">添加提醒</button>
    <button class="chip" id="insertTab" title="插入当前标签页标题和链接">🔗本页</button>
  </div>
  <div class="hint" id="msg">提醒日默认提前 30/7/1/0 天推送</div>
</main>

<script src="popup.js"></script>
</body>
</html>

services:
  remind-lite:
    build: .
    container_name: remind-lite
    image: remind-lite:1.0.5
    restart: unless-stopped
    ports:
      - "${RL_PORT:-15809}:8000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 真实部署值放同目录 .env（已 gitignore，绝不入库）；模板见 .env.example
      RL_USERNAME: ${RL_USERNAME:-admin}
      RL_PASSWORD: ${RL_PASSWORD:-changeme}
      RL_BASE_URL: ${RL_BASE_URL:-http://localhost:15809}
      RL_BARK_SERVER: ${RL_BARK_SERVER:-}

  # 可选：Cloudflare Tunnel 外网 HTTPS 入口（.env 配 CF_TUNNEL_TOKEN 后
  # 用 docker compose --profile tunnel up -d 启用）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: remind-lite-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on: [remind-lite]
